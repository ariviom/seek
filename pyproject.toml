[project]
name = "mentor"
version = "0.1.0"
description = "Turn YouTube channels into a cited, searchable knowledge base for Claude"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
mentor = "mentor.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor"]
artifacts = ["src/mentor/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/mentor", "web", "hatch_build.py"]
exclude = ["web/node_modules"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "hatch_build.py"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "hatchling.*"]
ignore_missing_imports = true
