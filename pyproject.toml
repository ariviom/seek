[project]
name = "mentor"
version = "0.1.0"
description = "Turn YouTube channels into a cited, searchable knowledge base for Claude"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "sqlite-vec>=0.1.9",
    "yt-dlp[default]>=2026.8",
    "snowballstemmer>=3.1.1",
    "sentence-transformers>=6.0.1",
    "torch>=2.14",
    "huggingface-hub>=1.31",
    "tqdm>=4.70",
    "mcp>=2.2,<3",
    "claude-agent-sdk>=0.2.152",
    "pyjwt[crypto]>=2.14",
    "keyring>=25",
    "anthropic>=1.7,<2",
]

[project.scripts]
mentor = "mentor.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3",
    "playwright>=1.62",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "types-tqdm>=4.70.0.20260906",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor"]
artifacts = ["src/mentor/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/mentor", "web", "hatch_build.py"]
exclude = ["web/node_modules"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Opt-in tests against real services: select them with `-m real_youtube` or `-m real_models`, which replaces this default.
addopts = "-m 'not real_youtube and not real_models'"
markers = ["real_youtube: fetches from YouTube itself", "real_models: downloads and runs the embedding and reranking models"]

[tool.mypy]
strict = true
files = ["src", "tests", "hatch_build.py"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "hatchling.*", "yt_dlp", "yt_dlp.*", "snowballstemmer"]
ignore_missing_imports = true
